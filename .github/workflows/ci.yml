name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# NOTE: this runs on every PR/push but does NOT yet gate the release/deploy on
# main — that needs branch protection making `test` a required check.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
