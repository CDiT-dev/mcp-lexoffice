name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'tests/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GITHUB_TOKEN, not a PAT: a tag it pushes triggers no other workflow (no cascade).

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - name: Install and test
        run: |
          uv sync --locked
          uv run pytest -x
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"

      - name: Tag release
        id: version
        # Tag-only release (2026-09-27): nothing is committed or pushed to main.
        # NEXT = latest v* tag + 1 patch; pyproject's version only seeds a repo with no tags.
        # No image is published: docker-compose.yml builds from source (Komodo run_build).
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$LAST" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          else
            NEXT=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          fi
          git tag "v${NEXT}"
          git push origin "v${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
