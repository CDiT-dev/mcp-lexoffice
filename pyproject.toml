[project]
name = "mcp-lexoffice"
version = "0.2.8"
description = "MCP server for Lexware Office (formerly Lexoffice) — invoices, contacts, and accounting"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
]

[project.scripts]
mcp-lexoffice = "mcp_lexoffice.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_lexoffice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
