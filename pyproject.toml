[project]
name = "mcp-lexoffice"
version = "0.3.12"
description = "MCP server for Lexware Office (formerly Lexoffice) — invoices, contacts, and accounting"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.2,<4.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    # Security floors (transitive deps of fastmcp; pinned to address CVEs)
    "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.27",  # GHSA: DoS via unbounded multipart headers
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
mcp-lexoffice = "mcp_lexoffice.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_lexoffice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
